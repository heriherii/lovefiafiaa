<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dari Heri Untuk Fia</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary-color: #ff4d6d;
    --secondary-color: #ff8fa3;
    --text-color: #590d22;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.envelope-container {
    position: relative;
    cursor: pointer;
}

.envelope {
    width: 300px;
    height: 200px;
    background: #ff4d6d;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
}

.flap {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-top: 110px solid #ff758f;
    top: 0;
    left: 0;
    transform-origin: top;
    transition: transform 0.6s ease;
    z-index: 3;
}

.pocket {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-bottom: 200px solid #ff4d6d;
    bottom: 0;
}

.letter-preview {
    width: 260px;
    height: 180px;
    background: white;
    position: absolute;
    bottom: 0;
    left: 20px;
    border-radius: 5px;
    transition: transform 0.8s ease;
}

.envelope-container.open .flap {
    transform: rotateX(180deg);
}

.envelope-container.open .letter-preview {
    transform: translateY(-100px);
}


#letter-view {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

#letter-view.active {
    display: flex;
}

.love-letter {
    background: white;
    width: 95%;
    max-width: 600px;
    height: 80vh;
    padding: 25px;
    border-radius: 10px;
    overflow-y: auto;
    font-family: "Dancing Script", cursive;
    position: relative;
}

.love-letter h2 {
    text-align: center;
    color: var(--primary-color);
    font-size: 2.5rem;
    margin-bottom: 20px;
}

.typing-text {
    font-size: 1.5rem;
    line-height: 1.8;
    white-space: pre-wrap;
    border-right: 2px solid var(--primary-color);
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% {
        border-color: transparent;
    }
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 28px;
    border: none;
    background: none;
    cursor: pointer;
}


@media (max-width:768px) {
    .envelope {
        width: 90vw;
        height: 60vw;
    }

    .flap {
        border-left: 45vw solid transparent;
        border-right: 45vw solid transparent;
        border-top: 33vw solid #ff758f;
    }

    .pocket {
        border-left: 45vw solid transparent;
        border-right: 45vw solid transparent;
        border-bottom: 60vw solid #ff4d6d;
    }

    .letter-preview {
        width: 80%;
        left: 10%;
        height: 85%;
    }

    .love-letter h2 {
        font-size: 2rem;
    }

    .typing-text {
        font-size: 1.2rem;
    }
}
</style>
</head>

<body>

<audio id="bg-music" loop>
    <source src="heri.mp3" type="audio/mpeg">
</audio>


<div class="envelope-container" id="envelope" onclick="openEnvelope()">
    <div class="envelope">
        <div class="pocket"></div>
        <div class="letter-preview"></div>
        <div class="flap"></div>
    </div>
</div>


<div id="letter-view">
    <div class="love-letter">
        <button class="close-btn" onclick="closeLetter()">×</button>
        <h2>Dear Fia ❤️</h2>
        <div id="typing-text" class="typing-text"></div>
    </div>
</div>

<script>
const text = `Hai Fia...

Selamat ulang tahun ke 23🎂

Semoga di usia yang baru ini, kamu selalu diberikan kesehatan, kebahagiaan, dan banyak hal baik yang mungkin selama ini kamu harapkan. Semoga semua langkah yang kamu ambil ke depannya dimudahkan, dan semoga apa pun yang sedang kamu perjuangkan bisa menemukan jalannya untuk menjadi kenyataan.

Aku bangga sama kamu. Bangga karena kamu sudah sampai sejauh ini, masih menjadi Fia yang aku kenal dari dulu sampai sekarang. Tetap menjadi seseorang yang baik untuk orang-orang di sekitarmu, menjadi anak yang baik, dan tentu saja menjadi seseorang yang membanggakan bagi orang-orang yang menyayangimu.

Jujur, aku nggak pernah benar-benar tahu bagaimana cara menyampaikan semuanya dengan sempurna.

Kadang ada begitu banyak hal yang tersimpan di kepala, begitu banyak rasa yang tinggal di hati, tapi semuanya terasa terlalu besar untuk dijelaskan hanya dengan beberapa kalimat sederhana.

Tapi lewat surat kecil ini, aku mau mencoba.

Aku mau bilang terima kasih.

Terima kasih karena pernah memaafkanku atas luka yang tanpa sengaja muncul karena kesalahanku.

Terima kasih karena dulu, tanpa kamu sadari, kamu pernah membawa begitu banyak warna ke dalam hidupku.

Mungkin bagi sebagian orang, itu adalah hal yang biasa.

Tapi buatku, itu berbeda.

Jujur...

Sebuah pesan singkat darimu pernah cukup untuk membuat hariku menjadi lebih baik.

Tawa khasmu pernah menjadi salah satu hal sederhana yang membuatku ikut bahagia.

Bahkan permintaan-permintaan kecil dan random yang datang darimu sering kali bisa membuatku bersemangat untuk mencoba mewujudkannya semampuku.

Dan entah kenapa, setiap kali bersamamu, ada rasa hangat yang sulit dijelaskan.

Aku sering berpikir...

Bagaimana bisa seseorang memiliki pengaruh sebesar itu dalam hidup orang lain?

Dan setiap kali memikirkannya, jawabannya selalu kembali kepadamu.

Mungkin kamu nggak pernah sadar, tapi ada banyak hal tentangmu yang aku kagumi.

Cara kamu berbicara.

Cara kamu tersenyum.

Cara kamu menghadapi banyak hal.

Bahkan cara kamu diam sekalipun.

Ada sesuatu dari dirimu yang selalu punya tempat tersendiri di pikiranku.

Aku suka bagaimana kamu menjadi dirimu sendiri.

Tanpa harus menjadi orang lain.

Tanpa harus berpura-pura menjadi seseorang yang bukan dirimu.

Di dunia yang penuh dengan ketidakpastian ini, menemukan seseorang yang tulus adalah sesuatu yang menurutku sangat berharga.

Dan aku bersyukur pernah mengenalmu.

Mungkin hubungan kita tidak berakhir seperti yang dulu kuharapkan.

Tapi aku tetap bersyukur pernah merasakan bahagia bersamamu, meskipun mungkin hanya dalam waktu yang singkat.

Aku berterima kasih untuk setiap momen yang pernah kita lewati.

Untuk percakapan-percakapan kecil.

Untuk candaan sederhana.

Untuk hal-hal random yang mungkin menurutmu tidak begitu berarti, tetapi ternyata mampu membuatku bahagia.

Kadang aku bertanya-tanya...

Apa kamu pernah tahu seberapa bahagianya aku ketika bersamamu?

Mungkin aku nggak selalu menunjukkannya.

Mungkin aku nggak selalu mengatakannya.

Mungkin dari luar aku terlihat biasa saja.

Tapi sebenarnya, ada banyak hal kecil tentangmu yang pernah aku simpan dengan baik di ingatanku.

Dan mungkin justru hal-hal sederhana itulah yang membuat sebuah kenangan menjadi begitu berarti.

Lucu ya...

Bagaimana seseorang bisa menjadi alasan dari kebahagiaan orang lain hanya dengan menjadi dirinya sendiri.

Dan kamu pernah menjadi salah satu alasan itu untukku.

Aku nggak tahu bagaimana masa depan akan berjalan.

Aku juga nggak tahu ke mana jalan hidup akan membawa kita masing-masing.

Mungkin nanti kita akan semakin jauh.

Mungkin hidup akan membawa kita ke cerita yang berbeda.

Tapi apa pun yang terjadi nanti, aku tetap berharap kamu selalu baik-baik saja.

Semoga kamu menemukan banyak alasan untuk tersenyum.

Semoga kamu dikelilingi orang-orang yang benar-benar menghargai dan menyayangimu.

Semoga semua hal baik yang kamu berikan kepada orang lain, suatu hari kembali kepadamu dalam bentuk yang jauh lebih indah.

Dan semoga di usia yang baru ini, kamu semakin mengenal dirimu sendiri, semakin kuat menghadapi hidup, dan tidak pernah kehilangan sisi baik dari dirimu yang selama ini aku kenal.

Selamat ulang tahun, Fia.

Terima kasih karena pernah hadir dan menjadi bagian dari salah satu cerita dalam hidupku.

Mungkin aku nggak akan selalu berada di dekatmu, dan mungkin kita tidak lagi memiliki cerita yang sama seperti dulu.

Tapi aku akan selalu mendoakan hal-hal baik untukmu.

Jaga dirimu baik-baik.

Dan kalau suatu hari nanti kamu mengingat masa-masa yang pernah kita lewati, semoga yang tersisa bukan hanya tentang bagaimana semuanya berakhir, tetapi juga tentang bagaimana kita pernah membuat satu sama lain bahagia.

Selamat bertambah usia.

Semoga hidup selalu baik kepadamu, Fia.

Dan sampai kapan pun, akan selalu ada bagian dari ingatanku yang menyimpan namamu dengan hangat.

Heri `;

let i = 0;
let typingTimeout;

function openEnvelope() {
    const env = document.getElementById("envelope");
    const letterView = document.getElementById("letter-view");
    const music = document.getElementById("bg-music");

    env.classList.add("open");
    music.play();

    setTimeout(() => {
        letterView.classList.add("active");

        i = 0;
        document.getElementById("typing-text").innerHTML = "";
        clearTimeout(typingTimeout);

        typeWriter();
    }, 1200);
}

function closeLetter() {
    document.getElementById("letter-view").classList.remove("active");

    const music = document.getElementById("bg-music");
    music.pause();
    music.currentTime = 0;

    clearTimeout(typingTimeout);
}

function typeWriter() {
    const target = document.getElementById("typing-text");

    if (i < text.length) {
        target.innerHTML += text.charAt(i);
        i++;

        // auto scroll while typing
        target.parentElement.scrollTop = target.parentElement.scrollHeight;
        typingTimeout = setTimeout(typeWriter, 80);
    }
}
</script>

</body>
</html>
